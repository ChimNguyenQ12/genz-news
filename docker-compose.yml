# Ghim tên project để deploy tay và deploy qua runner không sinh ra
# hai project khác nhau (compose mặc định suy tên từ tên thư mục).
name: genz-news

x-data-volume: &data-volume
  - ${APP_DATA_DIR:-/srv/genz-news/data}:/app/data

services:
  # Áp migration rồi thoát. App chỉ khởi động sau khi việc này thành công,
  # nên không bao giờ có chuyện app chạy trên schema cũ.
  migrate:
    build:
      context: .
      target: migrator
    image: genz-news-migrator
    container_name: genz-news-migrate
    restart: "no"
    # Bắt buộc chạy đúng uid của app, nếu không tệp .db do migrate tạo ra sẽ
    # thuộc root và app (user node) mở được nhưng không ghi được —
    # lỗi hiện ra là "attempt to write a readonly database".
    user: "1000:1000"
    volumes: *data-volume
    environment:
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/app.db

  app:
    build:
      context: .
      target: runner
    image: genz-news-app
    container_name: genz-news
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Chỉ nghe trên loopback; nginx ở host lo TLS và mở ra Internet.
    ports:
      - "127.0.0.1:5006:3000"
    volumes:
      # Trên máy chủ để trống → dùng đường tuyệt đối ngoài checkout.
      # Ở máy nhà đặt APP_DATA_DIR=./data để không đụng dữ liệu thật.
      - ${APP_DATA_DIR:-/srv/genz-news/data}:/app/data
      # Khoá AWS để đẩy ảnh/video lên S3. Chỉ đọc.
      # Thư mục này phải thuộc uid 1000 (user node trong container), vì
      # ~/.aws của root có quyền 600 nên container không đọc được:
      #   cp -r /root/.aws /srv/<app>/aws && chown -R 1000:1000 /srv/<app>/aws
      # Có IAM role gắn vào EC2 thì bỏ hẳn mount này — an toàn hơn.
      - ${AWS_DIR:-/srv/genz-news/aws}:/home/node/.aws:ro
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/app.db
      # S3 cho ảnh/video.
      S3_BUCKET: ${S3_BUCKET:-genz-news}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-s3-full-sandbox}
      AWS_SDK_LOAD_CONFIG: "1"
      # Khoá phiên: để trống thì app tự sinh và cất trong /app/data.
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-1}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # Facebook Page (lib/facebook.ts). Job deploy ghi hai biến này vào .env
      # từ biến CI/CD của GitLab; để trống thì trang /admin/facebook báo chưa cấu hình.
      FB_PAGE_ID: ${FB_PAGE_ID:-}
      FB_PAGE_ACCESS_TOKEN: ${FB_PAGE_ACCESS_TOKEN:-}
      # Threads (lib/social/threads.ts). Chỉ để nạp lần đầu: token gia hạn được
      # ghi vào data/threads-token.json, biến này đổi sang token khác thì nạp lại.
      THREAD_PAGE_ACCESS_TOKEN: ${THREAD_PAGE_ACCESS_TOKEN:-}
