# CI/CD cho GenZ News.
#
# Runner: shell executor, thẻ genz-news-deploy, có quyền gọi docker.
# Cả hai job dùng chung một thẻ — job mang thẻ không runner nào nhận sẽ nằm
# chờ mãi, và vì các stage chạy tuần tự, lint treo thì deploy không tới lượt.

variables:
  # KHÔNG dùng -ffdx: nó xoá cả tệp bị gitignore.
  GIT_CLEAN_FLAGS: "-ffd"
  APP_PORT: "5006"

stages:
  - lint
  - deploy

# Những thay đổi cần dựng lại ảnh. Dùng chung cho cả hai job: có thay đổi loại
# này thì chỉ chạy deploy (lint nằm sẵn trong bước dựng, xem Dockerfile), không
# có thì chỉ chạy lint.
.app_changes: &app_changes
  - app/**/*
  - components/**/*
  - lib/**/*
  - prisma/**/*
  - public/**/*
  - package.json
  - package-lock.json
  - Dockerfile
  - .dockerignore
  - docker-compose.yml
  - next.config.*
  - tsconfig.json
  - prisma.config.ts
  - eslint.config.mjs

lint:
  stage: lint
  tags: [genz-news-deploy]
  # Trên main, bỏ job này khi deploy sẽ chạy: runner dùng chung với
  # concurrent = 1, nên mỗi job thêm là thêm ~5 phút chờ runner nhận việc.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *app_changes
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    # Chạy trong container Node để không phụ thuộc Node cài trên host.
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/app -w /app node:22-bookworm-slim sh -c '
        npm ci --legacy-peer-deps --ignore-scripts &&
        npx prisma generate &&
        npm run lint &&
        npx tsc --noEmit
      '

# Dựng lại ảnh CHỈ khi mã của ứng dụng đổi. Máy chủ dùng chung 2 vCPU với
# nhiều dự án khác, mỗi lần biên dịch Next.js là một lần cả máy nghẹt thở —
# sửa một script chạy trên host hay một dòng tài liệu thì không đáng làm vậy.
deploy:
  stage: deploy
  tags: [genz-news-deploy]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *app_changes
  script:
    # Bí mật tuỳ chọn. Để trống cũng chạy được: app tự sinh khoá phiên và
    # cất vào thư mục data.
    - |
      {
        printf 'ADMIN_SESSION_SECRET=%s\n' "${ADMIN_SESSION_SECRET:-}"
        printf 'YOUTUBE_API_KEY=%s\n'      "${YOUTUBE_API_KEY:-}"
        printf 'S3_BUCKET=%s\n'            "${S3_BUCKET:-genz-news}"
        printf 'AWS_REGION=%s\n'           "${AWS_REGION:-us-east-1}"
        printf 'AWS_PROFILE=%s\n'          "${AWS_PROFILE:-s3-full-sandbox}"
        printf 'FB_PAGE_ID=%s\n'           "${FB_PAGE_ID:-}"
        printf 'FB_PAGE_ACCESS_TOKEN=%s\n' "${FB_PAGE_ACCESS_TOKEN:-}"
        printf 'THREAD_PAGE_ACCESS_TOKEN=%s\n' "${THREAD_PAGE_ACCESS_TOKEN:-}"
      } > .env
    - docker-compose up -d --build --remove-orphans
    - docker image prune -f
    # Chờ tới khi app thật sự trả lời, nếu không pipeline xanh trong lúc site 502.
    - |
      for i in $(seq 1 60); do
        if curl -fsS "http://127.0.0.1:${APP_PORT}/api/health" > /dev/null; then
          echo "healthcheck OK sau ${i}s"
          # Hâm nóng trang chủ (app cũng tự làm lúc khởi động — instrumentation.ts;
          # đây là lớp phụ): bỏ bản giữ chỗ dựng lúc build rồi xem trước một lượt.
          curl -fsS -o /dev/null -X POST "http://127.0.0.1:${APP_PORT}/api/internal/warm" || true
          curl -fsS -o /dev/null "http://127.0.0.1:${APP_PORT}/" || true
          exit 0
        fi
        sleep 1
      done
      echo "App không phản hồi sau 60s — log 80 dòng cuối:"
      docker-compose logs --tail=80
      exit 1

# KHÔNG có job đồng bộ script ở đây: job của runner chạy bằng user
# gitlab-runner, không ghi được vào /usr/local/bin lẫn /srv/<app>/repo (đều
# thuộc root). Thay vì cấp thêm quyền cho runner, các lệnh trong /usr/local/bin
# chỉ là vỏ bọc gọi thẳng bản trong repo, còn repo thì do chính cron kéo về.
# Sửa scripts/ hay CLAUDE.md là lượt cron kế tiếp đã dùng bản mới.
